<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background Badge with Gold Border -->
  <rect x="5" y="5" width="110" height="110" rx="24" fill="url(#rsGrad)" stroke="url(#goldBorder)" stroke-width="4.5" />
  <!-- Inner dashed decorative ring -->
  <rect x="12" y="12" width="96" height="96" rx="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Prominent Bold RS Letters -->
  <text x="60" y="73" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">RS</text>
  <!-- Gold Accent Underline -->
  <path d="M40 84 L80 84" stroke="url(#goldBorder)" stroke-width="3.5" stroke-linecap="round" />
</svg>
