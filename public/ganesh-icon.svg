<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ganeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle with soft ring -->
  <circle cx="50" cy="50" r="46" fill="#FFF7ED" stroke="url(#ganeshGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFA000" stroke-width="0.8" stroke-dasharray="2 3"/>
  
  <!-- Stylized Ganesha Silhouette / Om Motif -->
  <g fill="url(#ganeshGrad)" filter="url(#glow)">
    <!-- Tilak on forehead -->
    <path d="M47 18 H53 V28 Q50 32 47 28 Z" />
    <circle cx="50" cy="24" r="2.2" fill="#E11D48"/>
    <!-- Crescent / Head crown -->
    <path d="M41 24 C45 20, 55 20, 59 24 C56 22, 44 22, 41 24 Z" />
    <!-- Ears -->
    <!-- Left ear -->
    <path d="M38 33 C26 31, 23 44, 33 50 C36 47, 36 38, 38 33 Z" />
    <!-- Right ear -->
    <path d="M62 33 C74 31, 77 44, 67 50 C64 47, 64 38, 62 33 Z" />
    <!-- Face & Trunk flowing gracefully to the left -->
    <path d="M44 32 C42 38, 43 45, 45 52 C46 58, 44 65, 38 67 C33 68, 31 63, 34 60 C37 57, 40 60, 39 63 C41 63, 42 59, 41 54 C39 46, 38 38, 44 32 Z" />
    <!-- Single Tusk right -->
    <path d="M57 48 L62 50 L57 52 Z" fill="#FFA000"/>
    <!-- Modak / Laddu in hand -->
    <ellipse cx="64" cy="62" rx="5" ry="6" fill="#F59E0B"/>
    <path d="M64 54 Q65 57 66 59 Q62 59 64 54 Z" fill="#D97706"/>
    <!-- Sacred Om curve -->
    <circle cx="50" cy="78" r="3" fill="#D97706"/>
  </g>
</svg>
